apply plugin: 'com.android.library'
apply plugin: 'kotlin-android'
apply plugin: 'maven-publish'

group = 'sh.celia.novella'
version = '0.1.0'

def safeExtGet(prop, fallback) {
  rootProject.ext.find(prop) ?: fallback
}

android {
  namespace "sh.celia.novella.readium"
  compileSdk = safeExtGet("compileSdkVersion", 35)

  defaultConfig {
    minSdk = safeExtGet("minSdkVersion", 24)
    targetSdk = safeExtGet("targetSdkVersion", 35)
  }

  compileOptions {
    sourceCompatibility = JavaVersion.VERSION_17
    targetCompatibility = JavaVersion.VERSION_17
    coreLibraryDesugaringEnabled true
  }

  kotlinOptions {
    jvmTarget = "17"
  }

  publishing {
    singleVariant("release") {
      withSourcesJar()
    }
  }
}

repositories {
  google()
  mavenCentral()
}

dependencies {
  implementation project(':expo-modules-core')
  implementation "androidx.appcompat:appcompat:${safeExtGet('androidxAppCompatVersion', '1.7.0')}"
  implementation "androidx.core:core-ktx:${safeExtGet('androidxCoreKtxVersion', '1.13.1')}"

  // Readium Kotlin toolkit. readium-shared provides the publication model
  // (Publication/Locator/Container), readium-streamer parses the container into a
  // publication, and readium-navigator renders it in a WebView.
  //
  // Pinned deliberately: the Kotlin compiler here is 2.1.20 and can only read
  // class metadata up to 2.2.0. readium 3.4.0 ships metadata 2.4.0 and drags in
  // kotlin-stdlib 2.4.20, which makes even kotlin.Unit unresolvable. 3.1.0 is the
  // newest release whose metadata this toolchain can consume.
  def readiumVersion = safeExtGet("readiumVersion", "3.1.0")
  implementation "org.readium.kotlin-toolkit:readium-shared:$readiumVersion"
  implementation "org.readium.kotlin-toolkit:readium-streamer:$readiumVersion"
  implementation "org.readium.kotlin-toolkit:readium-navigator:$readiumVersion"

  // Core library desugaring is required by the toolkit. The version is kept at
  // 2.1.2 to match the app module: AGP propagates a library's desugar version as a
  // minimum requirement onto every consumer, so raising this alone makes
  // :app:checkDebugAarMetadata fail.
  coreLibraryDesugaring "com.android.tools:desugar_jdk_libs:2.1.2"
}
